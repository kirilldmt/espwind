name: Проверка проекта
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Тесты и сборка ESP32
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Скачать исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Подготовить Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Подготовить Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Подготовить Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: '1.6.0'
      - name: Установить зависимости
        run: |
          npm --prefix wind64-prototype ci
          sh firmware/setup.sh
      - name: Проверить прототип
        run: npm --prefix wind64-prototype test
      - name: Сравнить C++ и JavaScript
        run: node firmware/tests/parity.mjs
      - name: Собрать прошивку
        run: sh firmware/build-wind64.sh
      - name: Создать комплект прошивки
        run: python3 firmware/scripts/package-release.py
      - name: Сохранить комплект сборки
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wind64-firmware
          path: firmware/build/dist/*-firmware.zip
          if-no-files-found: error
